name: Build Native Apps

on:
  workflow_dispatch: # Erlaubt das manuelle Starten über den "Run workflow" Button auf GitHub

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: Afterfall-Linux
          - os: windows-latest
            artifact_name: Afterfall-Windows
          - os: macos-latest
            artifact_name: Afterfall-Mac
            
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Fat-JAR with Maven
      working-directory: frontend
      run: mvn clean package
      
    - name: Prepare jpackage input
      working-directory: frontend
      shell: bash
      run: |
        mkdir -p target/jpackage-input
        cp target/afterfall-frontend-*-standalone.jar target/jpackage-input/
        
    - name: Run jpackage (Windows)
      if: runner.os == 'Windows'
      working-directory: frontend
      run: |
        jpackage --name "Afterfall" --input target/jpackage-input/ --main-jar "afterfall-frontend-1.0.0-SNAPSHOT-standalone.jar" --main-class at.htl.afterfall.Launcher --dest target/dist --type app-image --win-console
        
    - name: Run jpackage (Mac)
      if: runner.os == 'macOS'
      working-directory: frontend
      run: |
        jpackage --name "Afterfall" --input target/jpackage-input/ --main-jar "afterfall-frontend-1.0.0-SNAPSHOT-standalone.jar" --main-class at.htl.afterfall.Launcher --dest target/dist --type dmg
        
    - name: Run jpackage (Linux)
      if: runner.os == 'Linux'
      working-directory: frontend
      run: |
        jpackage --name "Afterfall" --input target/jpackage-input/ --main-jar "afterfall-frontend-1.0.0-SNAPSHOT-standalone.jar" --main-class at.htl.afterfall.Launcher --dest target/dist --type app-image
        
    - name: Compress Linux/Windows App Image
      if: runner.os != 'macOS'
      working-directory: frontend/target/dist
      shell: bash
      run: |
        mkdir -p ../../../final-artifacts
        if [ "$RUNNER_OS" == "Linux" ]; then
          tar -czvf ../../../final-artifacts/${{ matrix.artifact_name }}.tar.gz Afterfall/
        else
          # Windows ZIP
          powershell Compress-Archive -Path Afterfall -DestinationPath ../../../final-artifacts/${{ matrix.artifact_name }}.zip
        fi
        
    - name: Move Mac DMG
      if: runner.os == 'macOS'
      working-directory: frontend/target/dist
      shell: bash
      run: |
        mkdir -p ../../../final-artifacts
        mv *.dmg ../../../final-artifacts/${{ matrix.artifact_name }}.dmg
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: final-artifacts/
